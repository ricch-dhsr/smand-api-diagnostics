name: Build Athol Test POI Map
 
on:
  workflow_dispatch:
 
permissions:
  contents: read
 
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
 
      - name: Create isolated two-stop OSM input
        shell: bash
        run: |
          mkdir -p test-map
          cat > test-map/Athol_Delivery_Stops_Test.osm <<'OSM'
          <?xml version="1.0" encoding="UTF-8"?>
          <osm version="0.6" generator="Tasker OsmAnd test">
            <node id="-18001" lat="42.60484" lon="-72.23818" version="1">
              <tag k="tourism" v="information"/>
              <tag k="name" v="18"/>
              <tag k="description" v="TEST ONLY - Stop 18 - 139 Western Avenue, Athol, MA 01331"/>
            </node>
            <node id="-19001" lat="42.60499" lon="-72.23756" version="1">
              <tag k="tourism" v="information"/>
              <tag k="name" v="19"/>
              <tag k="description" v="TEST ONLY - Stop 19 - 84 Castle Avenue, Athol, MA 01331"/>
            </node>
          </osm>
          OSM
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          p = 'test-map/Athol_Delivery_Stops_Test.osm'
          root = ET.parse(p).getroot()
          nodes = root.findall('node')
          assert len(nodes) == 2
          assert [next(t.attrib['v'] for t in n.findall('tag') if t.attrib['k'] == 'name') for n in nodes] == ['18', '19']
          print('Validated 2 test POIs')
          PY
 
      - name: Download OsmAndMapCreator
        shell: bash
        run: |
          curl --fail --location --retry 3 --retry-delay 5 \
            'https://download.osmand.net/latest-night-build/OsmAndMapCreator-main.zip' \
            --output OsmAndMapCreator-main.zip
          unzip -q OsmAndMapCreator-main.zip -d mapcreator
          find mapcreator -name utilities.sh -type f -print
 
      - name: Generate POI-only OBF
        shell: bash
        run: |
          UTIL="$(find "$GITHUB_WORKSPACE/mapcreator" -name utilities.sh -type f -print -quit)"
          test -n "$UTIL"
          chmod +x "$UTIL"
          cd test-map
          export JAVA_OPTS='-Xms256M -Xmx3G'
          "$UTIL" generate-poi Athol_Delivery_Stops_Test.osm
          echo 'OBF files created:'
          find . -type f -name '*.obf' -ls
          OBF="$(find . -type f -name '*.obf' -print -quit)"
          test -n "$OBF" || { echo 'ERROR: MapCreator produced no .obf file'; exit 1; }
          mkdir -p "$GITHUB_WORKSPACE/output"
          cp "$OBF" "$GITHUB_WORKSPACE/output/Athol_Delivery_Stops_Test.obf"
          test -s "$GITHUB_WORKSPACE/output/Athol_Delivery_Stops_Test.obf"
 
      - name: Upload test map
        uses: actions/upload-artifact@v4
        with:
          name: Athol-Delivery-Stops-Test-OBF
          path: output/Athol_Delivery_Stops_Test.obf
          if-no-files-found: error
          retention-days: 14
