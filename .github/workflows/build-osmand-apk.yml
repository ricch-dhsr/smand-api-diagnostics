name: Build OsmAnd API Demo APK
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Extract working OsmAnd source
        run: |
          mkdir -p source
          unzip -q .github/workflows/osmand-api-demo-diagnostics-v1.zip -d source
      - name: Add 25 numbered image markers test
        run: |
          python3 - <<'PYCODE'
          from pathlib import Path
          p = Path('source/osmand-api-demo-master/OsmAnd-api-sample/app/src/main/java/net/osmand/osmandapidemo/MainActivity.kt')
          s = p.read_text()
          start = s.index('ApiActionType.AIDL_ADD_MAP_POINT -> {')
          end = s.index('ApiActionType.AIDL_UPDATE_MAP_POINT -> {', start)
          old = s[start:end]
          assert 'aidlHelper.addMapPoint(' in old and 'location.name.substring(0, 1)' in old
          replacement = '''ApiActionType.AIDL_ADD_MAP_POINT -> {
                                  // Build #7: 25 separate images and AIDL map points.
                                  // Use the chosen demo city as the center of a 5x5 test grid.
                                  for (stop in 1..25) {
                                      val row = (stop - 1) / 5
                                      val col = (stop - 1) % 5
                                      val lat = location.lat + (row - 2) * 0.004
                                      val lon = location.lon + (col - 2) * 0.005
                                      val iconFile = java.io.File(cacheDir, "icons/numbered-stop-$stop.png")
                                      iconFile.parentFile?.mkdirs()
                                      val iconBitmap = android.graphics.Bitmap.createBitmap(256, 256, android.graphics.Bitmap.Config.ARGB_8888)
                                      val iconCanvas = android.graphics.Canvas(iconBitmap)
                                      val circlePaint = android.graphics.Paint(android.graphics.Paint.ANTI_ALIAS_FLAG)
                                      circlePaint.color = android.graphics.Color.rgb(25, 118, 210)
                                      iconCanvas.drawCircle(128f, 128f, 122f, circlePaint)
                                      val numberPaint = android.graphics.Paint(android.graphics.Paint.ANTI_ALIAS_FLAG)
                                      numberPaint.color = android.graphics.Color.WHITE
                                      numberPaint.textAlign = android.graphics.Paint.Align.CENTER
                                      numberPaint.typeface = android.graphics.Typeface.create(android.graphics.Typeface.DEFAULT, android.graphics.Typeface.BOLD)
                                      numberPaint.textSize = if (stop < 10) 174f else 138f
                                      val baseline = 128f - (numberPaint.ascent() + numberPaint.descent()) / 2f
                                      iconCanvas.drawText(stop.toString(), 128f, baseline, numberPaint)
                                      java.io.FileOutputStream(iconFile).use { stream ->
                                          iconBitmap.compress(android.graphics.Bitmap.CompressFormat.PNG, 100, stream)
                                      }
                                      iconBitmap.recycle()
                                      val iconUri = androidx.core.content.FileProvider.getUriForFile(
                                          this, "net.osmand.osmandapidemo.fileprovider", iconFile)
                                      grantUriPermission("net.osmand.plus", iconUri, android.content.Intent.FLAG_GRANT_READ_URI_PERMISSION)
                                      grantUriPermission("net.osmand", iconUri, android.content.Intent.FLAG_GRANT_READ_URI_PERMISSION)
                                      aidlHelper.addMapPoint(
                                          MAP_LAYER_ID,
                                          "test_stop_$stop",
                                          "", // Avoid duplicate tiny caption beneath icon.
                                          "Test Stop $stop",
                                          "Delivery stop",
                                          Color.BLUE,
                                          ALatLon(lat, lon),
                                          listOf("Test marker $stop", "Build #7"),
                                          mapOf(AMapPoint.POINT_IMAGE_URI_PARAM to iconUri.toString())
                                      )
                                  }
                              }
                              '''" + "'''" + r'''
          s = s[:start] + replacement + s[end:]
          start = s.index('ApiActionType.AIDL_REMOVE_MAP_POINT -> {')
          end = s.index('ApiActionType.AIDL_TAKE_PHOTO -> {', start)
          old = s[start:end]
          assert 'aidlHelper.removeMapPoint(MAP_LAYER_ID, "id_" + location.name)' in old
          replacement = '''ApiActionType.AIDL_REMOVE_MAP_POINT -> {
                                  for (stop in 1..25) {
                                      aidlHelper.removeMapPoint(MAP_LAYER_ID, "test_stop_$stop")
                                  }
                                  // Also clean up the earlier single-marker test, if present.
                                  aidlHelper.removeMapPoint(MAP_LAYER_ID, "id_" + location.name)
                              }
                              '''" + "'''" + r'''
          s = s[:start] + replacement + s[end:]
          p.write_text(s)
          print('Build #7 patch applied: 25 distinct numbered icons and matching remove action')
          PYCODE
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''
      - name: Build debug APK
        run: |
          cd source/osmand-api-demo-master/OsmAnd-api-sample
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: osmand-api-demo-debug
          path: source/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
