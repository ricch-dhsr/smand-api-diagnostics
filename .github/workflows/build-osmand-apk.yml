                  val radius = (markerRadius(slot) * scale).coerceIn(1f, center - stroke / 2f - 1f)
                  canvas.drawCircle(center, center, radius, circle)''')
          change('canvas.drawCircle(128f, 128f, radius - stroke / 2f, circle)', 'canvas.drawCircle(center, center, radius - stroke / 2f, circle)')
          change('''                  number.textSize = if (n < 10) 160f else 128f
                  canvas.drawText(n.toString(), 128f, 128f - (number.ascent() + number.descent()) / 2f, number)''', '''                  number.textSize = markerTextSize(slot, n)
                  canvas.drawText(n.toString(), center, center - (number.ascent() + number.descent()) / 2f, number)''')
          change('val iconFile = java.io.File(filesDir, "route_icons/" + slotKey(slot) + "_stop_" + n + ".png")', 'val iconFile = markerIconFile(slot, n)')
          change('val iconFile = java.io.File(filesDir, "route_icons/${slotKey(slot)}_stop_$n.png")', 'val iconFile = markerIconFile(slot, n)')
          change('                  if (incoming.hasExtra("route_color")) {', '''                  if (incoming.hasExtra("marker_size")) settings.putInt("marker_size_" + slot,
                      (incoming.getStringExtra("marker_size")?.toIntOrNull() ?: 256).coerceIn(96, 512))
                  if (incoming.hasExtra("marker_text_size")) settings.putFloat("marker_text_size_" + slot,
                      (incoming.getStringExtra("marker_text_size")?.toFloatOrNull() ?: 0f).coerceIn(0f, 400f))
                  if (incoming.hasExtra("route_color")) {''')
          change('''                  if (aidl == null || !(aidl.addMapLayer(taskerRouteLayer, slot + " Delivery Route", 5.5f, null, true) ||
                          aidl.updateMapLayer(taskerRouteLayer, slot + " Delivery Route", 5.5f, null, true))) {''', '''                  if (aidl?.isTaskerServiceConnected() != true) {''')
          change('''                  val previousCount = routePrefs().getInt("count_" + slot, 0)
                  for (n in 1..previousCount) aidl.removeMapPoint(taskerRouteLayer, "${slotKey(slot)}_stop_$n")''', '''                  // Replace the entire marker layer to remove all previous markers.
                  aidl?.removeMapLayer(taskerRouteLayer)
                  if (aidl?.addMapLayer(taskerRouteLayer, slot + " Delivery Route", 5.5f, null, true) != true) {
