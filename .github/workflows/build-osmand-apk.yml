name: Build OsmAnd API Demo APK
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Extract working OsmAnd source
        run: |
          mkdir -p source
          unzip -q .github/workflows/osmand-api-demo-diagnostics-v1.zip -d source
      - name: Build 12 Tasker AM PM EX routes and HERE road geometry
        run: |
          python3 - <<'PYCODE'
          from pathlib import Path
          p=Path('source/osmand-api-demo-master/OsmAnd-api-sample/app/src/main/java/net/osmand/osmandapidemo/MainActivity.kt')
          s=p.read_text()
          needle='    override fun onCreate(savedInstanceState: Bundle?) {'
          assert s.count(needle)==1
          feature=r'''
              // Build 12.1: independent AM/PM/EX route slots; retain HERE geometry and numbered markers.
              private val taskerRouteAction = "net.osmand.osmandapidemo.SHOW_ROUTE"
              private var routeRequestId = 0
 
              private fun slotKey(slot: String) = slot.lowercase(java.util.Locale.US)
              private fun layerId(slot: String) = "tasker_route_" + slotKey(slot)
              private fun gpxName(slot: String) = "tasker_" + slotKey(slot) + "_overview.gpx"
              private fun routeColor(slot: String): Int = when (slot) {
                  "PM" -> android.graphics.Color.rgb(230, 126, 34)
                  "EX" -> android.graphics.Color.rgb(46, 160, 85)
                  else -> android.graphics.Color.rgb(25, 118, 210)
              }
              private fun defaultGpxColor(slot: String): String = when (slot) {
                  "PM" -> "orange"
                  "EX" -> "green"
                  else -> "blue"
              }
              // Build 12.3: append-only diagnostic log in app-specific external files.
              private fun routeDiag(event: String) {
                  val line = java.text.SimpleDateFormat("yyyy-MM-dd HH:mm:ss.SSS", java.util.Locale.US)
                      .format(java.util.Date()) + " pid=" + android.os.Process.myPid() +
                      " activity=" + System.identityHashCode(this) + " " + event
                  android.util.Log.i("TaskerRouteDiag", line)
                  try {
                      val dir = getExternalFilesDir(null) ?: filesDir
                      synchronized(this) {
                          java.io.File(dir, "route_debug.log").appendText(line + "\n")
                      }
                  } catch (e: Exception) {
                      android.util.Log.e("TaskerRouteDiag", "File logging failed", e)
                  }
              }
              private fun routePrefs() = getSharedPreferences("tasker_route_slots", MODE_PRIVATE)
              private fun gpxColor(slot: String): String = routePrefs().getString("line_color_" + slot,
                  defaultGpxColor(slot)) ?: defaultGpxColor(slot)
              private fun parseMarkerColor(value: String?, fallback: Int): Int {
                  if (value.isNullOrBlank()) return fallback
                  return try { android.graphics.Color.parseColor(value) } catch (_: Exception) { fallback }
              }
              private fun markerFill(slot: String): Int = routePrefs().getInt("marker_fill_" + slot, routeColor(slot))
              private fun markerBorder(slot: String): Int = routePrefs().getInt("marker_border_" + slot, android.graphics.Color.RED)
              private fun markerBorderWidth(slot: String): Float = routePrefs().getFloat("marker_border_width_" + slot, 3f)
              private fun markerRadius(slot: String): Float = routePrefs().getFloat("marker_radius_" + slot, 112f)
              private fun drawRouteMarker(slot: String, n: Int, iconFile: java.io.File) {
                  iconFile.parentFile?.mkdirs()
                  val bitmap = android.graphics.Bitmap.createBitmap(256, 256, android.graphics.Bitmap.Config.ARGB_8888)
                  val canvas = android.graphics.Canvas(bitmap)
                  val circle = android.graphics.Paint(android.graphics.Paint.ANTI_ALIAS_FLAG)
                  circle.color = markerFill(slot)
                  val radius = markerRadius(slot)
                  canvas.drawCircle(128f, 128f, radius, circle)
                  val stroke = markerBorderWidth(slot)
                  if (stroke > 0f) {
                      circle.color = markerBorder(slot)
                      circle.style = android.graphics.Paint.Style.STROKE
                      circle.strokeWidth = stroke
                      canvas.drawCircle(128f, 128f, radius - stroke / 2f, circle)
                  }
                  val number = android.graphics.Paint(android.graphics.Paint.ANTI_ALIAS_FLAG)
                  number.color = android.graphics.Color.WHITE
                  number.textAlign = android.graphics.Paint.Align.CENTER
                  number.typeface = android.graphics.Typeface.create(android.graphics.Typeface.DEFAULT, android.graphics.Typeface.BOLD)
                  number.textSize = if (n < 10) 160f else 128f
                  canvas.drawText(n.toString(), 128f, 128f - (number.ascent() + number.descent()) / 2f, number)
                  java.io.FileOutputStream(iconFile).use { bitmap.compress(android.graphics.Bitmap.CompressFormat.PNG, 100, it) }
                  bitmap.recycle()
              }
 
 
              private fun setSlotVisibility(slot: String, visible: Boolean): Boolean {
                  val aidl = mAidlHelper ?: return false
                  val raw = routePrefs().getString("json_" + slot, null)
                  routeDiag("visibility slot=" + slot + " requested=" + visible +
                      " savedJson=" + (raw != null) + " layer=" + layerId(slot) +
                      " gpx=" + gpxName(slot))
                  if (raw == null) return false
                  val layer = layerId(slot)
                  if (visible) {
                      val stops = org.json.JSONObject(raw).getJSONArray("stops")
                      if (!(aidl.addMapLayer(layer, slot + " Delivery Route", 5.5f, null, true) ||
                            aidl.updateMapLayer(layer, slot + " Delivery Route", 5.5f, null, true))) return false
                      for (i in 0 until stops.length()) {
                          val n = i + 1
                          val stop = stops.getJSONObject(i)
                          val iconFile = java.io.File(filesDir, "route_icons/" + slotKey(slot) + "_stop_" + n + ".png")
                          drawRouteMarker(slot, n, iconFile)
                          val uri = androidx.core.content.FileProvider.getUriForFile(
                              this, "net.osmand.osmandapidemo.fileprovider", iconFile)
                          grantUriPermission("net.osmand.plus", uri, Intent.FLAG_GRANT_READ_URI_PERMISSION)
                          grantUriPermission("net.osmand", uri, Intent.FLAG_GRANT_READ_URI_PERMISSION)
                          aidl.addMapPoint(layer, slotKey(slot) + "_stop_" + n, "",
                              stop.getString("address"), slot + " Stop " + n, markerFill(slot),
                              ALatLon(stop.getDouble("lat"), stop.getDouble("lon")),
                              listOf("Stop " + n, stop.getString("address")),
                              mapOf(AMapPoint.POINT_IMAGE_URI_PARAM to uri.toString()))
                      }
                      // Re-import the saved GPX when necessary; it also makes the track visible.
                      val gpx = java.io.File(filesDir, gpxName(slot))
                      if (gpx.exists()) {
                          val uri = androidx.core.content.FileProvider.getUriForFile(
                              this, "net.osmand.osmandapidemo.fileprovider", gpx)
                          grantUriPermission("net.osmand.plus", uri, Intent.FLAG_GRANT_READ_URI_PERMISSION)
                          grantUriPermission("net.osmand", uri, Intent.FLAG_GRANT_READ_URI_PERMISSION)
                          aidl.importGpxFromUri(uri, gpxName(slot), gpxColor(slot), true)
                      }
                      if (!aidl.showGpx(gpxName(slot))) return false
                  } else {
                      routeDiag("hide " + slot + " removeMapLayer BEGIN")
                      val layerRemoved = aidl.removeMapLayer(layer)
                      routeDiag("hide " + slot + " removeMapLayer RESULT=" + layerRemoved)
                      routeDiag("hide " + slot + " hideGpx BEGIN")
                      val trackHidden = aidl.hideGpx(gpxName(slot))
                      routeDiag("hide " + slot + " hideGpx RESULT=" + trackHidden)
                      android.util.Log.i("TaskerRoute", "hide " + slot + " layerRemoved=" + layerRemoved + " trackHidden=" + trackHidden)
                      Toast.makeText(this, "hide " + slot + ": markers=" + layerRemoved + " GPX=" + trackHidden, Toast.LENGTH_LONG).show()
                      if (!layerRemoved || !trackHidden) return false
                  }
                  routeDiag("visibility " + slot + " SUCCESS=" + visible)
                  routePrefs().edit().putBoolean("visible_" + slot, visible).apply()
                  aidl.refreshMap()
                  return true
              }
 
              private fun clearSlot(slot: String): Boolean {
                  val aidl = mAidlHelper ?: return false
                  routeDiag("clear slot=" + slot + " saved=" + routePrefs().contains("json_" + slot))
                  aidl.removeMapLayer(layerId(slot))
                  aidl.removeGpx(gpxName(slot))
                  routePrefs().edit().remove("json_" + slot)
                      .remove("visible_" + slot).remove("count_" + slot).apply()
                  aidl.refreshMap()
                  return true
              }
 
              private fun returnToOsmandMap() {
                  val osmandIntent = packageManager.getLaunchIntentForPackage("net.osmand.plus")
                      ?: packageManager.getLaunchIntentForPackage("net.osmand")
                  routeDiag("returnToMap launchIntentFound=" + (osmandIntent != null))
                  if (osmandIntent != null) {
                      osmandIntent.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK or Intent.FLAG_ACTIVITY_REORDER_TO_FRONT)
                      startActivity(osmandIntent)
                      routeDiag("returnToMap startActivity issued")
                  }
              }
 
              private var commandGeneration = 0
              private var pendingRouteCommand: String? = null
              private fun onTaskerOsmandConnected() {
                  routeDiag("service callback interfaceReady=" +
                      (mAidlHelper?.isTaskerServiceConnected() == true) +
                      " pending=" + pendingRouteCommand)
                  val command = pendingRouteCommand ?: return
                  pendingRouteCommand = null
                  handleRouteCommand(command)
              }
              private fun handleRouteCommand(command: String) {
                  routeDiag("command received=" + command + " finishing=" + isFinishing +
                      " destroyed=" + isDestroyed + " interfaceReady=" +
                      (mAidlHelper?.isTaskerServiceConnected() == true))
                  if (isFinishing || isDestroyed) return
                  if (mAidlHelper?.isTaskerServiceConnected() != true) {
                      pendingRouteCommand = command
                      routeDiag("command queued=" + command)
                      return
                  }
                  val operation = command.substringBefore("_")
                  val suffix = command.substringAfter("_", "").uppercase(java.util.Locale.US)
                  if (operation !in listOf("show", "hide", "clear") ||
                      suffix !in listOf("AM", "PM", "EX", "ALL") ||
                      (operation == "clear" && suffix == "ALL")) {
                      Toast.makeText(this, "Unknown route command: " + command, Toast.LENGTH_LONG).show()
                      return
                  }
                  val slots = if (suffix == "ALL") listOf("AM", "PM", "EX") else listOf(suffix)
                  var changed = 0
                  try {
                      for (slot in slots) {
                          val ok = when (operation) {
                              "show" -> setSlotVisibility(slot, true)
                              "hide" -> setSlotVisibility(slot, false)
                              else -> clearSlot(slot)
                          }
                          routeDiag("command slot=" + slot + " operation=" + operation + " result=" + ok)
                          if (ok) changed++
                      }
                      routeDiag("command completed=" + command + " changed=" + changed)
                      Toast.makeText(this, command + ": " + changed + " slot(s)", Toast.LENGTH_SHORT).show()
                  } catch (e: Exception) {
                      routeDiag("command exception=" + command + " type=" + e.javaClass.name + " message=" + e.message)
                      android.util.Log.e("TaskerRoute", "Command failed: " + command, e)
                      Toast.makeText(this, "Route command failed: " + e.message, Toast.LENGTH_LONG).show()
                  } finally {
                      // Return to the map even if an individual API operation fails.
                      returnToOsmandMap()
                  }
              }
 
              // HERE flexible polyline decoder (2D coordinates, skips optional 3rd dimension).
              private fun decodeHerePolyline(encoded: String): List<Pair<Double, Double>> {
                  val alphabet = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789-_"
                  var pos = 0
                  fun unsigned(): Long {
                      var value = 0L
                      var shift = 0
                      while (true) {
                          require(pos < encoded.length && shift <= 60) { "Malformed HERE polyline" }
                          val digit = alphabet.indexOf(encoded[pos++])
                          require(digit >= 0) { "Invalid HERE polyline character" }
                          value = value or ((digit.toLong() and 31L) shl shift)
                          if ((digit and 32) == 0) return value
                          shift += 5
                      }
                  }
                  fun signed(): Long {
                      val n = unsigned()
                      return if ((n and 1L) == 0L) n shr 1 else -(n shr 1) - 1L
                  }
                  val version = unsigned()
                  require(version == 1L) { "Unsupported HERE polyline version" }
                  val header = unsigned().toInt()
                  val precision = header and 15
                  val thirdDim = (header shr 4) and 7
                  val thirdPrecision = (header shr 7) and 15
                  require(precision in 0..15 && thirdPrecision in 0..15) { "Bad precision" }
                  val factor = Math.pow(10.0, precision.toDouble())
                  var lat = 0L
                  var lon = 0L
                  val result = ArrayList<Pair<Double, Double>>()
                  while (pos < encoded.length) {
                      lat += signed()
                      lon += signed()
                      if (thirdDim != 0) signed() // consume elevation or other third dimension
                      val latitude = lat / factor
                      val longitude = lon / factor
                      require(latitude in -90.0..90.0 && longitude in -180.0..180.0) { "Bad decoded coordinate" }
                      result.add(Pair(latitude, longitude))
                      require(result.size <= 100000) { "Route too large" }
                  }
                  require(result.size >= 2) { "HERE polyline has too few points" }
                  return result
              }
 
              private fun hereRoadPoints(hereJson: String?, expectedLegs: Int): List<Pair<Double, Double>>? {
                  if (hereJson.isNullOrBlank() || expectedLegs < 1) return null
                  try {
                      val root = org.json.JSONObject(hereJson)
                      val routes = root.getJSONArray("routes")
                      require(routes.length() > 0) { "No HERE routes" }
                      val sections = routes.getJSONObject(0).getJSONArray("sections")
                      require(sections.length() == expectedLegs) { "Expected $expectedLegs HERE legs; got ${sections.length()}" }
                      val combined = ArrayList<Pair<Double, Double>>()
                      for (i in 0 until sections.length()) {
                          val points = decodeHerePolyline(sections.getJSONObject(i).getString("polyline"))
                          for (point in points) {
                              if (combined.isEmpty() || combined.last() != point) combined.add(point)
                          }
                      }
                      require(combined.size >= 2) { "Insufficient road geometry" }
                      return combined
                  } catch (e: Exception) {
                      android.util.Log.w("TaskerRoute", "HERE geometry rejected; using straight-line fallback", e)
                      return null
                  }
              }
 
              private fun acceptTaskerRoute(incoming: Intent?) {
                  routeDiag("intent action=" + incoming?.action + " hasCommand=" +
                      (incoming?.hasExtra("command") == true) + " hasRoute=" +
                      (incoming?.hasExtra("route_json") == true) + " hasHERE=" +
                      (incoming?.hasExtra("here_json") == true))
                  if (incoming?.action != taskerRouteAction) return
                  val command = incoming.getStringExtra("command")?.trim()?.lowercase(java.util.Locale.US)
                  if (!command.isNullOrEmpty()) {
                      commandGeneration++
                      handleRouteCommand(command)
                      return
                  }
                  val raw = incoming.getStringExtra("route_json")
                  if (raw.isNullOrBlank()) {
                      Toast.makeText(this, "Missing route_json", Toast.LENGTH_LONG).show()
                      return
                  }
                  val route: org.json.JSONObject
                  val stops: org.json.JSONArray
                  val slot: String
                  try {
                      route = org.json.JSONObject(raw)
                      slot = route.optString("route", "AM").uppercase(java.util.Locale.US)
                      require(slot in listOf("AM", "PM", "EX")) { "Invalid route slot" }
                      stops = route.getJSONArray("stops")
                      require(stops.length() in 1..50) { "Expected 1-50 stops" }
                      for (i in 0 until stops.length()) {
                          val stop = stops.getJSONObject(i)
                          val lat = stop.getDouble("lat")
                          val lon = stop.getDouble("lon")
                          require(lat in -90.0..90.0 && lon in -180.0..180.0) { "Invalid GPS coordinate" }
                          require(stop.getString("address").isNotBlank()) { "Missing address" }
                      }
                  } catch (e: Exception) {
                      Toast.makeText(this, "Invalid route JSON: ${e.message}", Toast.LENGTH_LONG).show()
                      return
                  }
                  // Optional appearance extras; saved separately for each route slot.
                  val settings = routePrefs().edit()
                  if (incoming.hasExtra("marker_color")) settings.putInt("marker_fill_" + slot,
                      parseMarkerColor(incoming.getStringExtra("marker_color"), routeColor(slot)))
                  if (incoming.hasExtra("marker_border_color")) settings.putInt("marker_border_" + slot,
                      parseMarkerColor(incoming.getStringExtra("marker_border_color"), android.graphics.Color.RED))
                  if (incoming.hasExtra("marker_border_width")) settings.putFloat("marker_border_width_" + slot,
                      (incoming.getStringExtra("marker_border_width")?.toFloatOrNull() ?: 3f).coerceIn(0f, 20f))
                  if (incoming.hasExtra("marker_radius")) settings.putFloat("marker_radius_" + slot,
                      (incoming.getStringExtra("marker_radius")?.toFloatOrNull() ?: 112f).coerceIn(64f, 124f))
                  if (incoming.hasExtra("route_color")) {
                      val color = incoming.getStringExtra("route_color")?.lowercase(java.util.Locale.US) ?: ""
                      if (color in listOf("red", "orange", "yellow", "lightgreen", "green", "lightblue", "blue", "purple", "pink", "brown"))
                          settings.putString("line_color_" + slot, color)
                  }
                  settings.apply()
                  val hereJson = incoming.getStringExtra("here_json")
                  val request = ++routeRequestId
                  routeDiag("route accepted slot=" + slot + " stops=" + stops.length() +
                      " herePresent=" + !hereJson.isNullOrBlank())
                  applyTaskerRouteWhenReady(route, stops, hereJson, request, 0, slot)
              }
 
              private fun applyTaskerRouteWhenReady(route: org.json.JSONObject, stops: org.json.JSONArray,
                                                    hereJson: String?, request: Int, attempt: Int, slot: String) {
                  if (request != routeRequestId || isFinishing || isDestroyed) return
                  val aidl = mAidlHelper
                  val taskerRouteLayer = layerId(slot)
                  if (aidl == null || !(aidl.addMapLayer(taskerRouteLayer, slot + " Delivery Route", 5.5f, null, true) ||
                          aidl.updateMapLayer(taskerRouteLayer, slot + " Delivery Route", 5.5f, null, true))) {
                      if (attempt < 30) {
                          android.os.Handler(android.os.Looper.getMainLooper()).postDelayed({
                              applyTaskerRouteWhenReady(route, stops, hereJson, request, attempt + 1, slot)
                          }, 500)
                      } else Toast.makeText(this, "OsmAnd service unavailable", Toast.LENGTH_LONG).show()
                      return
                  }
                  routeDiag("route install AIDL ready slot=" + slot + " attempt=" + attempt)
                  val previousCount = routePrefs().getInt("count_" + slot, 0)
                  for (n in 1..previousCount) aidl.removeMapPoint(taskerRouteLayer, "${slotKey(slot)}_stop_$n")
                  val blue = markerFill(slot)
                  var successful = 0
                  for (i in 0 until stops.length()) {
                      val n = i + 1
                      val stop = stops.getJSONObject(i)
                      val address = stop.getString("address")
                      val iconFile = java.io.File(filesDir, "route_icons/${slotKey(slot)}_stop_$n.png")
                      drawRouteMarker(slot, n, iconFile)
                      val uri = androidx.core.content.FileProvider.getUriForFile(
                          this, "net.osmand.osmandapidemo.fileprovider", iconFile)
                      grantUriPermission("net.osmand.plus", uri, Intent.FLAG_GRANT_READ_URI_PERMISSION)
                      grantUriPermission("net.osmand", uri, Intent.FLAG_GRANT_READ_URI_PERMISSION)
                      if (aidl.addMapPoint(taskerRouteLayer, "${slotKey(slot)}_stop_$n", "", address,
                              "$slot Stop $n", blue,
                              ALatLon(stop.getDouble("lat"), stop.getDouble("lon")),
                              listOf("Stop $n", address),
                              mapOf(AMapPoint.POINT_IMAGE_URI_PARAM to uri.toString()))) successful++
                  }
                  routePrefs().edit().putInt("count_" + slot, stops.length()).apply()
                  var roadFollow = false
                  try {
                      val road = hereRoadPoints(hereJson, stops.length() - 1)
                      roadFollow = road != null
                      val gpx = java.io.File(filesDir, gpxName(slot))
                      val xml = StringBuilder("<?xml version=\"1.0\" encoding=\"UTF-8\"?>" +
                          "<gpx version=\"1.1\" creator=\"Tasker Route Demo\" xmlns=\"http://www.topografix.com/GPX/1/1\"><trk><name>$slot Overview</name><trkseg>")
                      if (road != null) {
                          for (point in road) xml.append("<trkpt lat=\"").append(point.first)
                              .append("\" lon=\"").append(point.second).append("\"/>")
                      } else {
                          for (i in 0 until stops.length()) {
                              val stop = stops.getJSONObject(i)
                              xml.append("<trkpt lat=\"").append(stop.getDouble("lat"))
                                  .append("\" lon=\"").append(stop.getDouble("lon")).append("\"/>")
                          }
                      }
                      xml.append("</trkseg></trk></gpx>")
                      gpx.writeText(xml.toString())
                      val uri = androidx.core.content.FileProvider.getUriForFile(
                          this, "net.osmand.osmandapidemo.fileprovider", gpx)
                      grantUriPermission("net.osmand.plus", uri, Intent.FLAG_GRANT_READ_URI_PERMISSION)
                      grantUriPermission("net.osmand", uri, Intent.FLAG_GRANT_READ_URI_PERMISSION)
                      aidl.removeGpx(gpxName(slot))
                      aidl.importGpxFromUri(uri, gpxName(slot), gpxColor(slot), true)
                  } catch (e: Exception) {
                      android.util.Log.e("TaskerRoute", "GPX overview import failed", e)
                  }
                  routePrefs().edit().putString("json_" + slot, route.toString())
                      .putBoolean("visible_" + slot, true).apply()
                  routeDiag("route installed slot=" + slot + " markers=" + successful +
                      "/" + stops.length() + " roadFollow=" + roadFollow +
                      " saved=" + routePrefs().contains("json_" + slot))
                  val mode = if (roadFollow) "HERE roads" else "straight-line fallback"
                  Toast.makeText(this, "$slot route: $successful/${stops.length()} markers; $mode", Toast.LENGTH_LONG).show()
                  val osmandIntent = packageManager.getLaunchIntentForPackage("net.osmand.plus")
                      ?: packageManager.getLaunchIntentForPackage("net.osmand")
                  if (osmandIntent != null) {
                      osmandIntent.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
                      startActivity(osmandIntent)
                      android.os.Handler(android.os.Looper.getMainLooper()).postDelayed({
                          if (request == routeRequestId && !isDestroyed) {
                              val first = stops.getJSONObject(0)
                              mAidlHelper?.setMapLocation(first.getDouble("lat"), first.getDouble("lon"), 14, 0f, true)
                              mAidlHelper?.refreshMap()
                          }
                      }, 1200L)
                  } else Toast.makeText(this, "Open OsmAnd manually", Toast.LENGTH_LONG).show()
              }
 
              override fun onNewIntent(intent: Intent) {
                  super.onNewIntent(intent)
                  routeDiag("onNewIntent")
                  setIntent(intent)
                  acceptTaskerRoute(intent)
              }
 
          '''
          s=s.replace(needle,feature+needle,1)
          needle='        mAidlHelper = OsmAndAidlHelper(this.application, this)'
          assert s.count(needle)==1
          s=s.replace(needle,needle+'\n        routeDiag("onCreate after AIDL helper construction");\n        mAidlHelper?.setTaskerConnectedCallback(object : Runnable { override fun run() { onTaskerOsmandConnected() } });\n        acceptTaskerRoute(intent)',1)
          p.write_text(s)
          helper=Path('source/osmand-api-demo-master/OsmAnd-api-sample/app/src/main/java/net/osmand/osmandapidemo/OsmAndAidlHelper.java')
          h=helper.read_text()
          needle='\tpublic boolean refreshMap() {'
          assert h.count(needle)==1
          h=h.replace(needle, '\tprivate Runnable taskerConnectedCallback;\n\tpublic void setTaskerConnectedCallback(Runnable callback) {\n\t\ttaskerConnectedCallback = callback;\n\t\tif (callback != null && mIOsmAndAidlInterface != null) callback.run();\n\t}\n\tpublic boolean isTaskerServiceConnected() { return mIOsmAndAidlInterface != null; }\n\n'+needle,1)
          needle='mIOsmAndAidlInterface = IOsmAndAidlInterface.Stub.asInterface(service);'
          assert h.count(needle)==1
          h=h.replace(needle,needle+'\n\t\t\tif (taskerConnectedCallback != null) taskerConnectedCallback.run();',1)
          # Java helper diagnostics: Logcat only, app activity writes the persistent log.
          h=h.replace('mIOsmAndAidlInterface = IOsmAndAidlInterface.Stub.asInterface(service);',
                      'android.util.Log.i("TaskerRouteDiag", "AIDL onServiceConnected binder=" + (service != null));\n\t\t\tmIOsmAndAidlInterface = IOsmAndAidlInterface.Stub.asInterface(service);',1)
          helper.write_text(h)
          manifest=Path('source/osmand-api-demo-master/OsmAnd-api-sample/app/src/main/AndroidManifest.xml')
          m=manifest.read_text()
          needle='<activity\n\t\t\tandroid:name="main.java.net.osmand.osmandapidemo.MainActivity"\n\t\t\tandroid:exported="true"'
          assert needle in m
          m=m.replace(needle,needle+'\n            android:launchMode="singleTop"',1)
          needle='<intent-filter>\n\t\t\t\t<action android:name="android.intent.action.MAIN" />'
          assert needle in m
          m=m.replace(needle,'<intent-filter>\n                <action android:name="net.osmand.osmandapidemo.SHOW_ROUTE" />\n                <category android:name="android.intent.category.DEFAULT" />\n            </intent-filter>\n\n            '+needle,1)
          manifest.write_text(m)
          fp=Path('source/osmand-api-demo-master/OsmAnd-api-sample/app/src/main/res/xml/filepaths.xml')
          f=fp.read_text()
          assert '</paths>' in f
          f=f.replace('</paths>','    <files-path name="route_files" path="." />\n</paths>')
