                  return '\n'.join(line[10:] if len(line) - len(line.lstrip(' ')) >= threshold and threshold >= 10 else line
                                   for line in lines)
              if s.count(old) != 1:
                  old, new = normalized(old), normalized(new)
              assert s.count(old) == 1, 'Expected one match for: ' + old[:100]
              s = s.replace(old, new, 1)
 
