                      return
                  }
                  // A unique image URI on every install avoids OsmAnd's cached icons.
                  val revision = System.currentTimeMillis()
                  routePrefs().edit().putLong("icon_revision_" + slot, revision).apply()
                  routeDiag("route replacement slot=" + slot + " iconRevision=" + revision)''')
          change('''                  routePrefs().edit().putString("json_" + slot, route.toString())
                      .putBoolean("visible_" + slot, true).apply()''', '''                  routePrefs().edit().putString("json_" + slot, route.toString())
